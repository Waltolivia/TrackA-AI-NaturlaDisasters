[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "tracka-ai-probe-runner"
version = "0.1.0"
description = "Reproducible AI probes triggered by natural-disaster events"
requires-python = ">=3.11"
dependencies = ["python-dotenv>=1.0,<2"]

[project.optional-dependencies]
providers = [
  "openai>=1.0,<3",
  "anthropic>=0.40,<1",
  "google-genai>=1.0,<3",
  "cryptography>=43,<46",
]
dev = ["pytest>=8,<10"]

[project.scripts]
ai-probe-runner = "ai_probe_runner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
